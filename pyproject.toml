[tool.poetry]
name = "smriti"
version = "0.1.0"
description = "Reproducible, self-certifying pipeline for claim extraction, contradiction-aware knowledge graph construction, and reliability scoring over personal note vaults."
authors = ["Abhijnan B C <you@example.com>"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/AbhijnanBC/smriti"
packages = [{include = "smriti", from = "src"}]

[tool.poetry.dependencies]
# Cap at 3.12 for ML compatibility stability
python = ">=3.11,<3.13"

# Core ML/NLP
spacy = "^3.8"
sentence-transformers = "^3.4"
torch = "^2.5"
transformers = "^4.48"

# Retrieval (FAISS strictly on non-Windows, scikit-learn available as fallback)
scikit-learn = "^1.4"

# Data processing
numpy = "^1.26.4"
pandas = "^2.2"
networkx = "^3.4"
python-louvain = "^0.16"

# Parsing
markdown-it-py = "^3.0"
pypdf = "^5.0"

# Dashboard
streamlit = "^1.35"
plotly = "^5.22"

# Utilities
pyyaml = "^6.0"
python-dotenv = "^1.0"
structlog = "^24.1"
python-json-logger = "^2.0"
tqdm = "^4.66"
click = "^8.1"
pendulum = "^3.0"
psutil = "^5.9"
faiss-cpu = "^1.14.3"

[tool.poetry.group.dev.dependencies]
pytest = "^8.1"
pytest-cov = "^5.0"
pytest-mock = "^3.14"
black = "^24.4"
ruff = "^0.4"
mypy = "^1.10"
ipython = "^8.24"
hypothesis = "^6.156.7"
matplotlib = "^3.11.1"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ["py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C"]
ignore = ["E501", "B008"]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["smriti"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_incomplete_defs = false
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "--verbose --tb=short"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
]

[tool.coverage.run]
source = ["src/smriti"]