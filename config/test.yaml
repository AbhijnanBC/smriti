# config/test.yaml
env: test
debug: false

pipeline:
  max_notes: 100

logging:
  level: "WARNING"

embedding:
  batch_size: 4            # Small batches for test speed
  cache_embeddings: false  # No caching during tests
  normalize: true
  device: "cpu"
  instruction_prefix: ""
  max_seq_length: null

nli:
  nli_threshold: 0.70
  batch_size: 4
  cache_nli_results: false


# config/test.yaml — Phase 1 overrides for tests

discovery:
  supported_extensions:
    - ".md"
    - ".pdf"
    - ".txt"
  max_file_size_bytes: 1048576  # 1 MB limit in tests  

parsing:
  max_pdf_pages: 10
  max_text_length_chars: 100000
  min_extractable_chars: 1  

# config/test.yaml — Phase 3 test overrides
segmentation:
  min_sentence_chars: 1    # Accept very short sentences in tests
  max_sentence_chars: 5000  


# config/test.yaml — Phase 4 test overrides
claim_extraction:
  max_claims_per_sentence: 5
  split_conjunctions: true
  split_conditionals: false
  enable_annotation: true  

# (RECTIFIED, P0-7: "embedding_phase5" here used to duplicate and shadow
# "embedding:" above -- these overrides were never actually applied
# during test runs. Moved into "embedding:" above.)

relationship_discovery:
  top_k: 5
  sim_threshold: 0.50
  min_confidence: 0.40
  batch_size: 4
  cache_nli_results: false
  skip_unknown_relationships: false
  skip_neutral_relationships: false
  conflict_resolution_policy: "highest_confidence"
  deduplication_policy: "keep_highest_confidence"

resolver_policy:
  contradiction_margin: 0.0
  entailment_margin: 0.0
  confidence_policy: "raw"   # RECTIFIED (P1-C): calibration: {} below is IDENTITY, not a real calibrator

# (RECTIFIED, P0-7: "nli_phase6" here used to duplicate and shadow "nli:"
# above -- nli_threshold: 0.70 was never actually applied during test
# runs; moved into "nli:" above.)

calibration: {}

resource_governance:
  max_pairs: 1000
  timeout_seconds: 60.0
  cancel_on_limit: false

cache_invalidation:
  invalidate_on_embedding_change: true
  invalidate_on_model_change: true
  invalidate_on_policy_change: true  

knowledge_graph:
  include_neutral: false
  min_reliable_delta_days: 0.0
  hub_degree_multiplier: 1.5
  annotation:
    foundational_centrality_threshold: 0.30
    foundational_min_in_degree: 1
    evidence_hub_min_in_degree: 2
    refinement_root_min_out: 1
    peripheral_max_degree: 1  

scoring_policy:
  version: "test_1.0"
  # NOTE: profile and fusion.signal_weights intentionally NOT hardcoded here.
  # load_policy(profile=...) seeds signal_weights from the requested
  # PolicyProfile preset; a config value here takes priority over the
  # function argument (see scoring/policies.py::load_policy), so pinning
  # them would make every profile collapse to "balanced" in tests
  # (see tests/unit/test_phase8_policies.py::test_policy_profile_loads_correct_weights).
  evidence:
    echo_chamber_penalty: 0.20
    max_support_count: 5
    lineage_depth_limit: 1
    publisher_domain_weight: 0.30

knowledge_api:
  max_page_size: 100
  default_page_size: 10
  cache:
    enabled: true
    max_size: 10
  max_traversal_depth: 3
  indexes:
    enabled: true
    fields:
      - "calibration_label"
      - "partition_id"      